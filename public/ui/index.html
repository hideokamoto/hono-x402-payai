<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>x402 Payer Agent</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: -apple-system, "SF Pro Text", sans-serif;
        background: #0f1115;
        color: #e6e6e6;
      }
      .app {
        max-width: 720px;
        margin: 0 auto;
        height: 100dvh;
        display: flex;
        flex-direction: column;
        padding: 16px;
        gap: 12px;
      }
      header h1 { font-size: 18px; margin: 0 0 6px; }
      .fail-toggle { font-size: 13px; color: #aaa; display: flex; gap: 6px; align-items: center; }
      main { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
      .hint { color: #777; font-size: 13px; }
      .msg { border-radius: 10px; padding: 10px 12px; font-size: 14px; }
      .msg.user { background: #1f2937; align-self: flex-end; max-width: 85%; }
      .msg.assistant { background: #14181f; border: 1px solid #262c36; }
      .role { font-size: 11px; color: #888; text-transform: uppercase; margin-bottom: 4px; }
      .msg p { margin: 4px 0; white-space: pre-wrap; }
      .payment { border-radius: 8px; padding: 8px 10px; margin: 6px 0; font-size: 13px; }
      .payment.settled { background: #0d2b18; border: 1px solid #1f7a45; }
      .payment.failed { background: #2b1214; border: 1px solid #8a3238; }
      .payment a { color: #7ab8ff; word-break: break-all; }
      .payment-error { color: #ff9c9c; margin-top: 4px; }
      .tool, details { margin: 6px 0; font-size: 13px; }
      summary { cursor: pointer; color: #9aa4b2; }
      pre {
        background: #0b0e12;
        border: 1px solid #262c36;
        border-radius: 6px;
        padding: 8px;
        overflow-x: auto;
        font-size: 12px;
      }
      form { display: flex; gap: 8px; }
      input[type="text"], form input:first-child {
        flex: 1;
        background: #14181f;
        border: 1px solid #303844;
        border-radius: 8px;
        color: #e6e6e6;
        padding: 10px 12px;
        font-size: 14px;
      }
      button {
        background: #2563eb;
        color: #fff;
        border: 0;
        border-radius: 8px;
        padding: 0 18px;
        font-size: 14px;
        cursor: pointer;
      }
      button:disabled { opacity: 0.4; cursor: default; }
      .error { color: #ff9c9c; font-size: 13px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
